[package]
name = "generator"
version = "0.1.0"
edition = "2021"

[dependencies]
domain-core = { path = "../domain-core" }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
fake = "2.9"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
