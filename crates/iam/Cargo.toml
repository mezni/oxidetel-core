[package]
name = "iam"
version = "0.1.0"
edition = "2021"

[dependencies]
domain-core = { path = "../domain-core" }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros"] }
argon2 = "0.5"
jsonwebtoken = "9.2"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
async-trait = "0.1"
