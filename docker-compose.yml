services:
  postgres:
    image: postgres:15-alpine
    container_name: oxidetel-postgres
    environment:
      POSTGRES_DB: oxidetel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oxidetel"]
      interval: 5s
      timeout: 5s
      retries: 5

  bss:
    build: .
    container_name: oxidetel-bss
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/oxidetel
      - RUST_LOG=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
