version: '3.8'
services:
  telecom-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telecom
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  telecom-backend:
    build: .
    depends_on:
      telecom-db:
        condition: service_healthy
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "8005:8005"
      - "8006:8006"
    environment:
      DATABASE_URL: postgres://postgres:postgres@telecom-db:5432/telecom
    restart: on-failure

volumes:
  pg_data:
