[package]
name = "oxidetel-bss"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/domain-core",
    "crates/iam",
    "crates/crm",
    "crates/catalog", 
    "crates/ordering",
]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"   # <-- Added this line
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
domain-core = { path = "crates/domain-core" }
crm = { path = "crates/crm" }
catalog = { path = "crates/catalog" }
ordering = { path = "crates/ordering" }
