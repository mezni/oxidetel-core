[package]
name = "oxidetel-bss"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
    "crates/domain-core",
    "crates/iam",
    "crates/crm",
    "crates/catalog",
    "crates/ordering",
    "crates/generator",
    "crates/billing",
    "crates/dunning",
]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "bigdecimal"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
domain-core = { path = "crates/domain-core" }
iam = { path = "crates/iam" }
crm = { path = "crates/crm" }
catalog = { path = "crates/catalog" }
ordering = { path = "crates/ordering" }
generator = { path = "crates/generator" }
billing = { path = "crates/billing" }
dunning = { path = "crates/dunning" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.22"
tower-http = { version = "0.5", features = ["trace", "cors"] }
metrics-exporter-prometheus = { version = "0.13", default-features = false, features = ["http-listener"] }
